name: Build TruckNav APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.9"
          arguments: assembleDebug

      - name: Upload debug APK artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: TruckNav-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Set release version from tag
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          VERSION_CODE="${GITHUB_REF_NAME#v}"
          [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || (echo "Release tag must look like v8, v9, etc." && exit 1)
          echo "TRUCKNAV_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "TRUCKNAV_VERSION_NAME=0.$VERSION_CODE.0" >> "$GITHUB_ENV"

      - name: Configure release signing key
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          KEYSTORE_BASE64: ${{ secrets.TRUCKNAV_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing TRUCKNAV_KEYSTORE_BASE64 repository secret" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/trucknav-release.jks"
          echo "TRUCKNAV_KEYSTORE_FILE=$RUNNER_TEMP/trucknav-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          TRUCKNAV_KEYSTORE_PASSWORD: ${{ secrets.TRUCKNAV_KEYSTORE_PASSWORD }}
          TRUCKNAV_KEY_ALIAS: ${{ secrets.TRUCKNAV_KEY_ALIAS }}
          TRUCKNAV_KEY_PASSWORD: ${{ secrets.TRUCKNAV_KEY_PASSWORD }}
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.9"
          arguments: assembleRelease

      - name: Publish APK release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" app/build/outputs/apk/release/app-release.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/app-release.apk \
              --title "TruckNav $GITHUB_REF_NAME" \
              --notes "TruckNav update. Download the APK to install or update the app."
          fi
