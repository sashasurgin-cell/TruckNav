name: Build TruckNav APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.9"
          arguments: assembleDebug -PMAPS_API_KEY=${{ secrets.MAPS_API_KEY }} -PHERE_API_KEY=${{ secrets.HERE_API_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TruckNav-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
